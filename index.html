<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Controle de Relé</title>

  <style>
    :root{
      --bg: #0b1020;
      --surface: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --shadow: 0 18px 40px rgba(0,0,0,.35);
      --radius: 18px;
      --radius-sm: 14px;
      --focus: 0 0 0 3px rgba(130, 160, 255, .35);
      --accent1: #7f00ff;
      --accent2: #00d4ff;
      --ok: #27c29b;
      --warn: #f1b54a;
      --bad: #ff5b6e;
      color-scheme: dark;
    }

    *{ box-sizing: border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(900px 600px at 15% 10%, rgba(127,0,255,.28), transparent 60%),
        radial-gradient(900px 600px at 85% 0%, rgba(0,212,255,.18), transparent 55%),
        radial-gradient(900px 700px at 50% 95%, rgba(255,91,110,.10), transparent 60%),
        var(--bg);
      color: var(--text);
      padding: 28px 16px 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrap{
      max-width: 600px;
      width: 100%;
    }

    .shell{
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 6px);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar{
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(127,0,255,.20), rgba(0,212,255,.12));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    h1{
      margin:0;
      font-size: 18px;
      letter-spacing: .2px;
      line-height: 1.2;
    }

    .subtitle{
      display:flex;
      gap:10px;
      flex-wrap: wrap;
      align-items:center;
      color: var(--muted);
      font-size: 12px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.18);
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
    }

    .dot{
      width:8px; height:8px; border-radius: 99px;
      background: rgba(255,255,255,.35);
      box-shadow: 0 0 0 3px rgba(255,255,255,.10);
    }

    .content{
      padding: 32px 24px;
      text-align: center;
    }

    .status-box{
      margin-bottom: 24px;
      padding: 16px;
      border-radius: var(--radius-sm);
      background: rgba(0,0,0,.18);
      border: 1px solid var(--border);
    }

    .status-label{
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .status-value{
      font-size: 16px;
      font-weight: 650;
      color: var(--text);
    }

    .status-value.success{
      color: var(--ok);
    }

    .status-value.error{
      color: var(--bad);
    }

    .status-value.loading{
      color: var(--warn);
    }

    button{
      border-radius: 14px;
      border: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(127,0,255,.55), rgba(0,212,255,.35));
      border-color: rgba(255,255,255,.14);
      color: var(--text);
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
      outline: none;
      transition: transform .06s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease;
      user-select: none;
      min-width: 200px;
    }

    button:focus{
      box-shadow: var(--focus);
      border-color: rgba(130,160,255,.45);
    }

    button:hover{
      border-color: rgba(255,255,255,.22);
      background: linear-gradient(90deg, rgba(127,0,255,.68), rgba(0,212,255,.42));
    }

    button:active{
      transform: translateY(1px);
    }

    button:disabled{
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .message{
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      display: none;
    }

    .message.show{
      display: block;
    }

    .message.success{
      background: rgba(39, 194, 155, .15);
      border: 1px solid rgba(39, 194, 155, .3);
      color: var(--ok);
    }

    .message.error{
      background: rgba(255, 91, 110, .15);
      border: 1px solid rgba(255, 91, 110, .3);
      color: var(--bad);
    }

    .message.info{
      background: rgba(241, 181, 74, .15);
      border: 1px solid rgba(241, 181, 74, .3);
      color: var(--warn);
    }

    input[type="text"], input[type="password"]{
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.22);
      color: var(--text);
      padding: 12px 16px;
      font-size: 14px;
      outline: none;
      transition: transform .06s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease;
      width: 100%;
    }

    input[type="checkbox"]{
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent1);
    }

    input[type="text"]:focus, input[type="password"]:focus{
      box-shadow: var(--focus);
      border-color: rgba(130,160,255,.45);
    }

    .login-form{
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group{
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hidden{
      display: none !important;
    }
  </style>
</head>

<body>
  <!-- Tela de Login -->
  <div class="wrap" id="loginScreen">
    <div class="shell">
      <div class="topbar">
        <div class="title">
          <h1>Controle de Relé</h1>
          <div class="subtitle">
            <span class="badge">Acesso Restrito</span>
          </div>
        </div>
      </div>

      <div class="content">
        <div class="status-box">
          <div class="status-label">Login</div>
          <div class="login-form">
            <div class="form-group">
              <label class="status-label">Usuário</label>
              <input type="text" id="loginUser" placeholder="Digite seu usuário" autocomplete="username" />
            </div>
            <div class="form-group">
              <label class="status-label">Senha</label>
              <input type="password" id="loginPassword" placeholder="Digite sua senha" autocomplete="current-password" />
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: -8px; margin-bottom: 8px;">
              <input type="checkbox" id="rememberMe" style="width: auto; min-width: auto; cursor: pointer;" />
              <label for="rememberMe" class="status-label" style="margin: 0; cursor: pointer;">Lembrar-me</label>
            </div>
            <button onclick="fazerLogin()" style="margin-top: 8px;">
              Entrar
            </button>
            <div class="message" id="loginMessage"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tela Principal -->
  <div class="wrap hidden" id="mainScreen">
    <div class="shell">
      <div class="topbar">
        <div class="title">
          <h1>Controle de Relé</h1>
          <div class="subtitle">
            <span class="badge"><span class="dot"></span> API: <strong id="apiUrl">sites-api-rele.aal5pu.easypanel.host</strong></span>
            <span class="badge" id="badgeStatus"><span class="dot"></span> Status: <strong>Pronto</strong></span>
          </div>
        </div>
        <div style="margin-left: auto;">
          <button onclick="fazerLogout()" style="min-width: auto; padding: 8px 16px; font-size: 12px; background: rgba(255, 91, 110, .3); border-color: rgba(255, 91, 110, .5);">
            Sair
          </button>
        </div>
      </div>

      <div class="content">
        <div class="status-box">
          <div class="status-label">Status da Conexão</div>
          <div class="status-value" id="connectionStatus">Pronto</div>
        </div>

        <div style="margin-bottom: 20px;">
          <div class="status-label" style="margin-bottom: 16px;">Estado do Relé</div>
          <div class="toggle-label">
            <label class="toggle-switch">
              <input type="checkbox" id="toggleRele" onchange="toggleRele()" />
              <span class="toggle-slider"></span>
            </label>
            <div class="toggle-status" id="toggleStatus">—</div>
          </div>
        </div>

        <div class="message" id="message"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "__API_BASE_URL__";
    const API_KEY = "__API_KEY__";
    const LOGIN_USER = "__LOGIN_USER__";
    const LOGIN_PASSWORD = "__LOGIN_PASSWORD__";

    const $ = (id) => document.getElementById(id);
    const messageEl = $("message");
    const connectionStatusEl = $("connectionStatus");
    const badgeStatusEl = $("badgeStatus");
    const appliedStatusEl = $("appliedStatus");
    const btnOn = $("btnOn");
    const btnOff = $("btnOff");
    const loginScreen = $("loginScreen");
    const mainScreen = $("mainScreen");

    // Verifica se já está logado
    function checkLogin() {
      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true' || sessionStorage.getItem('isLoggedIn') === 'true';
      if (isLoggedIn) {
        showMainScreen();
      } else {
        showLoginScreen();
        // Preenche usuário se estiver salvo
        const savedUser = localStorage.getItem('savedUser');
        if (savedUser) {
          $("loginUser").value = savedUser;
          $("rememberMe").checked = true;
        }
      }
    }

    function showLoginScreen() {
      loginScreen.classList.remove('hidden');
      mainScreen.classList.add('hidden');
    }

    function showMainScreen() {
      loginScreen.classList.add('hidden');
      mainScreen.classList.remove('hidden');
      // Carrega o estado atual do relé ao mostrar a tela principal
      carregarEstadoRele();
    }

    async function carregarEstadoRele() {
      try {
        setStatus("Carregando estado...", "loading");
        const url = `${API_BASE_URL}/rele?api_key=${encodeURIComponent(API_KEY)}`;
        
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          },
          cache: 'no-store',
          mode: 'cors'
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        
        if (data.ok && data.last_applied) {
          // Atualiza a interface com o estado atual (usa last_applied)
          const estado = data.last_applied.toLowerCase();
          updateToggleState(estado);
          
          // Mostra apenas o estado atual
          const statusText = estado === "on" ? "Ligado" : "Desligado";
          setStatus(`Estado: ${statusText}`, estado === "on" ? "success" : "info");
        } else {
          setStatus("Erro ao carregar estado", "error");
        }
      } catch (error) {
        console.error("Erro ao carregar estado do relé:", error);
        setStatus("Erro ao carregar estado", "error");
        // Não mostra erro na interface, apenas no console
      }
    }

    function fazerLogin() {
      const user = $("loginUser").value.trim();
      const password = $("loginPassword").value.trim();
      const rememberMe = $("rememberMe").checked;
      const loginMessage = $("loginMessage");

      console.log("Tentativa de login:");
      console.log("Usuário digitado:", user);
      console.log("Senha digitada:", password ? "***" : "(vazia)");
      console.log("LOGIN_USER esperado:", LOGIN_USER);
      console.log("LOGIN_PASSWORD esperado:", LOGIN_PASSWORD ? "***" : "(vazio)");
      console.log("Usuário match:", user === LOGIN_USER);
      console.log("Senha match:", password === LOGIN_PASSWORD);

      if (!user || !password) {
        loginMessage.textContent = "Preencha usuário e senha";
        loginMessage.className = "message show error";
        return;
      }

      if (user === LOGIN_USER && password === LOGIN_PASSWORD) {
        if (rememberMe) {
          localStorage.setItem('isLoggedIn', 'true');
          localStorage.setItem('savedUser', user);
        } else {
          sessionStorage.setItem('isLoggedIn', 'true');
          localStorage.removeItem('isLoggedIn');
          localStorage.removeItem('savedUser');
        }
        loginMessage.className = "message";
        showMainScreen();
      } else {
        loginMessage.textContent = "Usuário ou senha incorretos";
        loginMessage.className = "message show error";
        $("loginPassword").value = "";
      }
    }

    function fazerLogout() {
      localStorage.removeItem('isLoggedIn');
      localStorage.removeItem('savedUser');
      sessionStorage.removeItem('isLoggedIn');
      showLoginScreen();
      $("loginUser").value = "";
      $("loginPassword").value = "";
      $("rememberMe").checked = false;
    }

    // Permite fazer login pressionando Enter
    document.addEventListener('DOMContentLoaded', function() {
      $("loginPassword").addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          fazerLogin();
        }
      });
      $("loginUser").addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          $("loginPassword").focus();
        }
      });
      checkLogin();
    });

    function updateToggleState(activeValue) {
      const isOn = activeValue === "on";
      toggleRele.checked = isOn;
      toggleStatus.textContent = isOn ? "LIGADO" : "DESLIGADO";
      toggleStatus.className = `toggle-status ${activeValue}`;
    }

    function toggleRele() {
      const newState = toggleRele.checked ? "on" : "off";
      acionarRele(newState);
    }

    function setStatus(status, type = "info") {
      connectionStatusEl.textContent = status;
      connectionStatusEl.className = `status-value ${type}`;
      
      const statusText = type === "success" ? "Conectado" : 
                        type === "error" ? "Erro" : 
                        type === "loading" ? "Processando..." : "Pronto";
      const statusStrong = badgeStatusEl.querySelector("strong");
      if (statusStrong) {
        statusStrong.textContent = statusText;
      }
    }

    function showMessage(text, type = "info") {
      messageEl.textContent = text;
      messageEl.className = `message show ${type}`;
      
      setTimeout(() => {
        messageEl.classList.remove("show");
      }, 5000);
    }

    async function acionarRele(appliedValue) {
      toggleRele.disabled = true;
      setStatus("Enviando comando...", "loading");
      messageEl.classList.remove("show");
      updateToggleState(appliedValue);

      try {
        const url = `${API_BASE_URL}/rele`;
        const body = {
          api_key: API_KEY,
          applied: appliedValue
        };
        
        console.log("Enviando requisição para:", url);
        console.log("Body:", body);
        
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(body),
          cache: 'no-store',
          mode: 'cors'
        });
        
        console.log("Response status:", response.status);
        console.log("Response ok:", response.ok);

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errorText || response.statusText}`);
        }

        const data = await response.json();
        
        setStatus("Comando enviado com sucesso", "success");
        const estadoTexto = appliedValue === "on" ? "ligado" : "desligado";
        showMessage(`Relé ${estadoTexto} com sucesso!`, "success");
        
        // Recarrega o estado após um pequeno delay para garantir sincronização
        // Usa last_applied para mostrar o estado real
        setTimeout(carregarEstadoRele, 1000);
        
      } catch (error) {
        let errorMsg = error.message || String(error);
        
        console.error("Erro completo:", error);
        console.error("Tipo do erro:", error.name);
        console.error("Stack:", error.stack);
        
        if (errorMsg.includes("Failed to fetch") || errorMsg.includes("network") || errorMsg.includes("CORS") || error.name === "TypeError") {
          errorMsg = `Erro de conexão/CORS: ${errorMsg}. Verifique se a API está acessível e se CORS está configurado. URL: ${API_BASE_URL}/rele`;
        }
        
        setStatus("Erro ao acionar", "error");
        showMessage(`Erro: ${errorMsg}`, "error");
        toggleStatus.textContent = "—";
        toggleStatus.className = "toggle-status";
        // Reverte o toggle em caso de erro
        setTimeout(() => carregarEstadoRele(), 500);
      } finally {
        toggleRele.disabled = false;
      }
    }
  </script>
</body>
</html>
